description: Residents who lived in the same home one year ago
meta_why: >
  The share of residents who lived in the same home a year ago is a widely used proxy for
  residential stability and rootedness — conditions associated with stronger social ties, local
  knowledge, and civic participation. It is an indirect measure: it reflects who stays put, not
  voting, volunteering, or membership, which the ACS does not collect. High mobility is not
  inherently negative (it can signal opportunity or housing churn), so read it in context.
